# 游戏内测试代理（NeoForge 26.1）—— 工程属性
#
# 这是一个「工具 mod」工程：它不是一个给玩家玩的模组，而是让 AI 能在真实客户端里
# 跑场景测试的进程内代理。产物 jar 会被注入到被测试工程的 runClient 运行时里。
#
# ⚠️ 这个文件里的值全部是具体值（没有占位符），因为代理工程的 modid / 包名是固定的。
#    只有 org.gradle.java.installations.paths 需要按本机改写 ——
#    驱动脚本 scripts/游戏内测试.py 会在构建前自动改写这一行。

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 代理工程不启用配置缓存：构建脚本要读 -P 传入的覆盖项，缓存收益不值当。
org.gradle.configuration-cache=false

minecraft_version=26.1
minecraft_version_range=[26.1,26.2)
neo_version=26.1.0.19-beta
neo_version_range=[26.1.0,)

mod_id=mctestagent
# 中文必须写成 \uXXXX：Gradle 按 ISO-8859-1 读 .properties
mod_name=\u6E38\u620F\u5185\u6D4B\u8BD5\u4EE3\u7406
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.mctestagent

# 由 scripts/游戏内测试.py 自动改写为本机 JDK 路径
# （Gradle toolchain 自动下载走 GitHub Releases，国内常失败）
org.gradle.java.installations.paths=C:/Users/17732/AppData/Roaming/.minecraft/runtime/java-runtime-epsilon
org.gradle.java.installations.auto-download=false
